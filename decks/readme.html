<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hachura design</title>
<!-- Capa do README. Depois de editar, gere a imagem de novo:
     node ferramentas/exportar.mjs decks/readme.html docs/readme/capa -->
<link rel="stylesheet" href="../sistema.css">
</head>
<body>

<main class="deck" data-brand="hachura design" data-section="Sistema de design" data-motion="off">

  <section class="slide cover">
    <div class="text">
      <h1>hachura design<span class="dot">.</span></h1>
      <p class="sub">Slides 16:9 e posts 4:5 no mesmo HTML, feitos para uma IA montar e você apresentar.</p>
    </div>
    <figure class="art">
      <span class="label">do conteúdo à peça pronta</span>
      <div class="flow">
        <div class="node card"><i class="px lg" data-icon="pencil"></i><span class="label">conteúdo</span></div>
        <span class="link arrow"></span>
        <div class="node card focus"><i class="px lg t-accent" data-icon="code"></i><span class="label">sistema</span></div>
        <span class="link arrow"></span>
        <div class="node card"><i class="px lg" data-icon="image"></i><span class="label">slide ou post</span></div>
      </div>
      <div class="bars">
        <span class="label">ícones em pixel</span><span class="track"><i class="accent" style="--v:100"></i></span><b>74</b>
        <span class="label">slides de exemplo</span><span class="track"><i style="--v:22"></i></span><b>16</b>
        <span class="label">formatos</span><span class="track"><i style="--v:3"></i></span><b>2</b>
      </div>
    </figure>
  </section>

</main>

<script src="../icons/icons.js"></script>
<script src="../sistema.js"></script>
</body>
</html>
